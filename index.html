<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Petal Pusher</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #2a1640;
    overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: pan-x pan-y;
  }
  #game {
    position: fixed;
    top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
  }
  canvas { display: block; touch-action: none; }
  #haptic { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<div id="game"></div>
<label id="haptic" aria-hidden="true"><input type="checkbox" switch></label>
<script>
  // A game file failed to load (connection dropped during an update): say so instead of a blank screen.
  (() => {
    const oops = () => {
      if (window.GAME || document.getElementById('oops')) return;
      const b = document.createElement('button'); b.id = 'oops'; b.type = 'button';
      b.textContent = 'Something went wrong. Tap to reload 🌱';
      b.style.cssText = 'position:fixed;inset:0;margin:auto;width:80%;height:120px;font:700 22px system-ui;color:#5b2f9e;background:#ffd35a;border:4px solid #fff;border-radius:40px;z-index:9';
      b.onclick = () => location.reload();
      document.body.append(b);
    };
    addEventListener('error', e => { if (e.target && e.target.tagName === 'SCRIPT') oops(); }, true);
    addEventListener('error', e => { if (!(e.target && e.target.tagName)) setTimeout(oops, 0); });
  })();
</script>
